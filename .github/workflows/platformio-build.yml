name: VQEAF OS PlatformIO (ESP32-S3)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'boards/**'
      - 'partitions/**'
      - 'platformio.ini'
      - 'tools/build_pio.py'
      - 'tools/build_factory_img.py'
      - 'tools/test_factory_img.py'
      - 'tools/check_board_config.py'
      - '.github/workflows/platformio-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install toolchain
        run: python -m pip install platformio pillow
      - name: Validate board and firmware
        run: python tools/build_pio.py --target-only
      - name: Test factory image safety and build default clean-install IMG
        run: |
          python -m unittest discover -s tools -p test_factory_img.py -v
          python tools/build_factory_img.py --build-dir .pio/build/vqeaf_os --output dist/VQEAF-OS_factory_ESP32S3_N16R8.img
          python tools/build_factory_img.py --verify-only --output dist/VQEAF-OS_factory_ESP32S3_N16R8.img
      - name: Upload firmware and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqeaf-os-esp32s3-n16r8
          path: |
            .pio/build/vqeaf_os/bootloader.bin
            dist/*.img
            dist/*.img.json
            .pio/build/vqeaf_os/firmware.bin
            .pio/build/vqeaf_os/firmware.elf
            .pio/build/vqeaf_os/partitions.bin
            build_reports/**
          if-no-files-found: warn
