name: VQEAF OS v2.5.1 Back r2 host regression
on:
  push:
    branches:
      - release/v2.5.1-back-r2
    paths:
      - 'src/**'
      - 'tools/**'
      - 'docs/RELEASE_V251_BACK_R2_GITHUB.md'
      - '.github/workflows/v251_back_r2_host.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'docs/RELEASE_V251_BACK_R2_GITHUB.md'
  workflow_dispatch:
jobs:
  host-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python host dependencies
        run: python -m pip install cryptography Pillow pyserial
      - name: Verify Arduino FS path helper (host mock)
        run: python tools/test_pio_fs_dependency.py
      - name: Verify C++11 Back state machine and input routing
        run: python tools/test_backguard_v251.py
      - name: Run v2.5.1 eight-stage host acceptance
        run: python tools/verify_v251.py
# PlatformIO ESP32-S3 build runs separately via platformio-build.yml; host test != board test.
